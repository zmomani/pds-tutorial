dle" font-family="Consolas, Menlo, monospace" font-weight="normal">Irbid</text><rect x="466" y="144" width="72" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="502.0" y="162.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">2</text><rect x="538" y="144" width="72" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="574.0" y="162.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">10</text><text x="390" y="196" font-size="12" fill="#1e7f4f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">index="city" gives the rows</text><text x="390" y="215" font-size="12" fill="#c8862b" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">columns="product" gives the columns</text><text x="390" y="234" font-size="12" fill="#1b1f24" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="normal">aggfunc="sum" fills each cell:</text><text x="390" y="253" font-size="12" fill="#1f3a5f" text-anchor="start" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">Amman + Laptop = 3 + 1 = 4</text></svg>