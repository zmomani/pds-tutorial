<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t d"><title id="t">From a long table to a pivot table</title><desc id="d">Six rows of city, product and units are turned into a grid with Amman and Irbid as rows and Laptop and Phone as columns. Amman Laptop is 4 because two rows are added.</desc><rect width="680" height="300" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3a5f"/></marker></defs><text x="140" y="30" font-size="13" fill="#1f3a5f" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" font-weight="600">long: one row per sale</text><rect x="40" y="44" width="70" height="27" fill="#eef1f5" stroke="#c9d0da" stroke-width="1.2"/><text x="75.0" y="62.0" font-size="12" fill="#7a8291" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">city</text><rect x="110" y="44" width="76" height="27" fill="#eef1f5" stroke="#c9d0da" stroke-width="1.2"/><text x="148.0" y="62.0" font-size="12" fill="#7a8291" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">product</text><rect x="186" y="44" width="54" height="27" fill="#eef1f5" stroke="#c9d0da" stroke-width="1.2"/><text x="213.0" y="62.0" font-size="12" fill="#7a8291" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">units</text><rect x="40" y="71" width="70" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="75.0" y="89.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Amman</text><rect x="110" y="71" width="76" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="148.0" y="89.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Laptop</text><rect x="186" y="71" width="54" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="213.0" y="89.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">3</text><rect x="40" y="98" width="70" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="75.0" y="116.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Amman</text><rect x="110" y="98" width="76" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="148.0" y="116.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Phone</text><rect x="186" y="98" width="54" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="213.0" y="116.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">5</text><rect x="40" y="125" width="70" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="75.0" y="143.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Irbid</text><rect x="110" y="125" width="76" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="148.0" y="143.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Laptop</text><rect x="186" y="125" width="54" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="213.0" y="143.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">2</text><rect x="40" y="152" width="70" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="75.0" y="170.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Irbid</text><rect x="110" y="152" width="76" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="148.0" y="170.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Phone</text><rect x="186" y="152" width="54" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="213.0" y="170.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">4</text><rect x="40" y="179" width="70" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="75.0" y="197.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Amman</text><rect x="110" y="179" width="76" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="148.0" y="197.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Laptop</text><rect x="186" y="179" width="54" height="27" fill="#dbe7f5" stroke="#1f3a5f" stroke-width="1.2"/><text x="213.0" y="197.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">1</text><rect x="40" y="206" width="70" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="75.0" y="224.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Irbid</text><rect x="110" y="206" width="76" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="148.0" y="224.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">Phone</text><rect x="186" y="206" width="54" height="27" fill="#ffffff" stroke="#c9d0da" stroke-width="1.2"/><text x="213.0" y="224.0" font-size="12" fill="#1b1f24" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-weight="normal">6</text><line x1="262" y1="140" x2="352" y2="140" stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#